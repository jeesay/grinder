<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Random Data Table</title>
     <style>
         table { border-collapse: collapse; width: 100%; font-family:sans-serif; }
         th, td { border: 1px solid #ddd; padding: 8px; text-align:center; }
         th { background-color: #f4f4f4; position: sticky; top: 0; }
         tr:nth-child(even) { background-color: #fafafa; }
     </style>
</head>
<body>

     <h2>10,000 Rows of Random Data</h2>
     <table id="dataTable">
         <thead>
             <tr id="headerRow"></tr>
         </thead>
         <tbody id="tableBody"></tbody>
     </table>

     <script>
         const ROWS = 50000;
         const COLS = 10;
         const tableBody = document.getElementById('tableBody');
         const headerRow = document.getElementById('headerRow');

         // 1. Generate Headers (A, B, C...)
         for (let i = 0; i < COLS; i++) {
             const th = document.createElement('th');
             // String.fromCharCode(65) is 'A'
             th.textContent = String.fromCharCode(65 + i);
             headerRow.appendChild(th);
         }

         // 2. Generate Rows using a DocumentFragment for performance
         const fragment = document.createDocumentFragment();

         for (let r = 0; r < ROWS; r++) {
             const tr = document.createElement('tr');

             for (let c = 0; c < COLS; c++) {
                 const td = document.createElement('td');
                 // Generates a random integer between 0 and 1000
                 td.textContent = Math.floor(Math.random() * 1001);
                 tr.appendChild(td);
             }

             fragment.appendChild(tr);
         }

         // 3. Final injection (Only one DOM reflow)
         tableBody.appendChild(fragment);
     </script>

</body>
</html>
