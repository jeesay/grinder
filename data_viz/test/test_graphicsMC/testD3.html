<script src="https://d3js.org/d3.v7.min.js"></script>

<div id="motion-viz-container" style="max-width: 900px; margin: auto; font-family: sans-serif;">
    <h3>Statistiques de Motion Correction (Accumulated Motion)</h3>
    <div id="motion-chart"></div>
    <div id="tooltip" style="position: absolute; opacity: 0; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 4px; pointer-events: none; font-size: 12px; box-shadow: 0px 0px 5px rgba(0,0,0,0.1);"></div>
</div>

<style>
    /* Styles pour rendre le graphique propre */
    .axis-label { font-size: 12px; font-weight: bold; }
    .line-total { fill: none; stroke: #e15759; stroke-width: 2px; }
    .line-early { fill: none; stroke: #4e79a7; stroke-width: 1.5px; stroke-dasharray: 4; }
    .line-late { fill: none; stroke: #59a14f; stroke-width: 1.5px; stroke-dasharray: 4; }
    .dot { cursor: pointer; transition: r 0.1s; }
    .dot:hover { r: 6; stroke: #000; stroke-width: 2px; }
    .legend text { font-size: 12px; }
</style>

<script>
// 3. Les données (Extraites de votre fichier .star et converties en JSON)
// Pour la production, vous pouvez générer ce JSON dynamiquement côté serveur.
const data = [
    {id: 1, total: 5.499, early: 0.348, late: 5.151},
    {id: 2, total: 6.434, early: 0.443, late: 5.990},
    {id: 3, total: 5.768, early: 0.549, late: 5.219},
    {id: 4, total: 5.130, early: 0.300, late: 4.830},
    {id: 5, total: 6.315, early: 0.336, late: 5.978},
    {id: 6, total: 5.903, early: 0.451, late: 5.451},
    {id: 7, total: 7.357, early: 0.644, late: 6.713},
    {id: 8, total: 5.073, early: 0.123, late: 4.949},
    {id: 9, total: 4.681, early: 0.401, late: 4.280},
    {id: 10, total: 14.269, early: 1.729, late: 12.539},
    {id: 18, total: 19.910, early: 3.744, late: 16.165}, // Exemple de pic
    {id: 47, total: 27.221, early: 1.026, late: 26.194}, // Autre pic
    {id: 139, total: 114.797, early: 10.528, late: 104.269} // Le pic massif
    // Ajoutez ici le reste des données générées par votre pipeline...
];

// 4. Configuration des dimensions du graphe
const margin = {top: 40, right: 120, bottom: 50, left: 60};
const width = 850 - margin.left - margin.right;
const height = 400 - margin.top - margin.bottom;

// Création du conteneur SVG
const svg = d3.select("#motion-chart")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// 5. Échelles X et Y
const x = d3.scaleLinear()
  .domain(d3.extent(data, d => d.id))
  .range([ 0, width ]);

const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => Math.max(d.total, d.early, d.late)) * 1.1]) // +10% de marge en haut
  .range([ height, 0 ]);

// 6. Ajout des Axes
svg.append("g")
  .attr("transform", `translate(0,${height})`)
  .call(d3.axisBottom(x).ticks(10).tickFormat(d3.format("d"))); // Format entier pour les IDs

svg.append("g").call(d3.axisLeft(y));

// Labels des axes
svg.append("text")
    .attr("text-anchor", "end")
    .attr("x", width / 2)
    .attr("y", height + 40)
    .attr("class", "axis-label")
    .text("ID de la Micrographie");

svg.append("text")
    .attr("text-anchor", "end")
    .attr("transform", "rotate(-90)")
    .attr("y", -40)
    .attr("x", -height / 2 + 50)
    .attr("class", "axis-label")
    .text("Mouvement Accumule");

// 7. Création des lignes
const lineTotal = d3.line().x(d => x(d.id)).y(d => y(d.total));
const lineEarly = d3.line().x(d => x(d.id)).y(d => y(d.early));
const lineLate  = d3.line().x(d => x(d.id)).y(d => y(d.late));

svg.append("path").datum(data).attr("class", "line-total").attr("d", lineTotal);
svg.append("path").datum(data).attr("class", "line-early").attr("d", lineEarly);
svg.append("path").datum(data).attr("class", "line-late").attr("d", lineLate);

// 8. Tooltip et Interaction (Points au survol)
const tooltip = d3.select("#tooltip");

const showTooltip = function(event, d) {
    tooltip.style("opacity", 1)
           .html(`<strong>Micrograph #${d.id}</strong><br>
                  Total: ${d.total.toFixed(2)}<br>
                  Early: ${d.early.toFixed(2)}<br>
                  Late: ${d.late.toFixed(2)}`)
           .style("left", (event.pageX + 15) + "px")
           .style("top", (event.pageY - 28) + "px");
};
const hideTooltip = function(event, d) { tooltip.style("opacity", 0); };

// Ajout des points pour Total
svg.selectAll("dot")
    .data(data)
    .enter()
    .append("circle")
      .attr("class", "dot")
      .attr("cx", d => x(d.id))
      .attr("cy", d => y(d.total))
      .attr("r", 4)
      .attr("fill", "#e15759")
      .on("mouseover", showTooltip)
      .on("mouseout", hideTooltip);

// 9. Légende
const legend = svg.append("g").attr("transform", `translate(${width + 10}, 20)`);
const keys = [
    {name: "Total", color: "#e15759", type: "solid"},
    {name: "Early", color: "#4e79a7", type: "dashed"},
    {name: "Late", color: "#59a14f", type: "dashed"}
];

keys.forEach((key, i) => {
    legend.append("line")
          .attr("x1", 0).attr("x2", 20).attr("y1", i * 20).attr("y2", i * 20)
          .attr("stroke", key.color)
          .attr("stroke-width", 2)
          .attr("stroke-dasharray", key.type === "dashed" ? "4" : "0");
    
    legend.append("text")
          .attr("x", 25).attr("y", i * 20 + 4)
          .text(key.name)
          .style("fill", key.color)
          .attr("class", "axis-label");
});
</script>
